[project]
name = "ticket-agent"
version = "0.1.0"
description = "Personal flight price tracker using the Kiwi.com MCP server"
readme = "README.md"
authors = [
    { name = "Tom Nordal", email = "tnordal@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.3.0",
]

[project.scripts]
ticket-agent = "ticket_agent:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
